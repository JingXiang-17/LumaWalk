name: Build and Deploy LumaWalk Web
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./lunawalk_frontend

      - name: Build Web
        run: flutter build web --release
        working-directory: ./lunawalk_frontend

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "bot@github.action"
          git config --global user.name "GitHub Action Bot"
          cd lunawalk_frontend/build/web
          git init
          git checkout -b main
          git add .
          git commit -m "Deploy prototype"
          git push -f https://AC865:$HF_TOKEN@huggingface.co/spaces/AC865/LumaWalk main